# 标记完成的验收路线。注意：复选框勾没勾在可访问树里读不到（pitfalls §8），
# 所以"已完成"这个状态只从有文字的地方验——header 计数器和统计页。

goal: 两条任务里一条被标成已完成，这个状态是真存下来的

steps:
  - go: 打开任务列表 http://localhost:4173/ 并读取列表
    check:
      - 任务列表里正好有两条任务，标题就是 context.task_titles 里那两条
      - header 里的计数器显示「未完成 1」

  - go: 打开统计视图 http://localhost:4173/?view=stats
    check:
      - 「总任务数」等于 2
      - 「已完成」等于 1
      - 「未完成」等于 1
