# GitHub 仓库主流程的验收路线。格式说明见 todo-persistence/expect.yaml 头注。
#
# 这是一个公网只读场景：裁判和 runner 加载的每一屏都是线上真页面，没人能在中间改它。
# 唯一一个"跑的时候才知道"的事实是 runner 点开的是哪条工单——它在 context 里。

goal: 仓库页、工单列表、工单详情三屏都真的加载出对应的内容，且详情页那条工单就是列表里的第一条

steps:
  - go: 打开 https://github.com/facebook/react 仓库主页，读取仓库名、自述文件和顶部标签页
    check:
      - 页面标题或仓库名区域能读到 react/react 这个仓库
      - 自述文件正文渲染出来了，出现这句原文「React is a JavaScript library for building user interfaces.」
      - 顶部能看到 Code、Issues、Pull requests 三个仓库标签页

  - go: 打开 https://github.com/facebook/react/issues 工单列表页，读取列表
    check:
      - 列表页显示了 Open 和 Closed 两个计数
      - 列表里至少有一条带井号编号的工单条目

  - go: 打开 context.issue_url 这条工单的详情页，读取标题、编号和状态
    check:
      - 这条工单的编号是 context.issue_number（页面上以井号加数字的形式出现）
      - 这条工单的标题是 context.issue_title
      - 页面上能看到这条工单的状态标记，要么是开启、要么是已关闭，不是空白或错误页
