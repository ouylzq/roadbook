# 演示场景的验收路线。裁判 agent 按 steps **顺序**走：先执行 go 自己导航过去，
# 读页面，然后逐条回答 check。不跳步、不重排、不自己规划路线。
# 协议见 references/judge-protocol.md；退出码由 scripts/judge.py 给出——
# 它只校验 judgment.yaml 与本文件镜像、引用的值都在，不比对语义。
#
# 怎么写：
#   go       一句导航指令。有 URL 就给 URL
#   check    一行一个事实，而且必须指向页面上读得到的东西
#
# 期望值直接写数字、写文案。context.xxx 只用来引用 runner 跑的时候才知道的东西
# （它实际输入的名字、新建对象的 id、操作前的余额）——别让 runner 把"应该是多少"抄进
# context，那样裁判就是在按 runner 的说法判 runner。
#
# 只有 go 和 check 两个键。**不需要**你标"这一步要不要刷新"——裁判每步都自己加载页面，
# 那一次加载就是干净的读，这条保证写在协议里、永远生效（见协议「怎么走」第 2 条）。
# 万一某一步真的需要再加载一次（比如后端有读副本延迟），就把这句话直接写进 go：
#   go: 打开详情页 /x/context.id，加载完再刷新一次，确认读到的不是首屏缓存
# 用人话说，别为它加开关——开关是"忘了写就静默失去保护"的脚枪。
#
# 注意：值里别出现 ASCII 的半角冒号加空格，全角标点随意用。

goal: 在演示应用里加一个任务，确认它是真被存下来了，而不只是渲染出来

steps:
  - go: 打开任务列表 http://localhost:4173/ 并读取列表
    check:
      - 任务列表里正好有一条任务，标题是 context.task_title
      - header 里的计数器显示「未完成 1」

  - go: 打开统计视图 http://localhost:4173/?view=stats
    check:
      - 「总任务数」等于 1
      - 「未完成」等于 1
