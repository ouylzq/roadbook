# 重置的验收路线。这条路线不引用 context.*，期望值全是零。

goal: 点了重置之后存储真的空了，不是列表画成了空

steps:
  - go: 打开任务列表 http://localhost:4173/ 并读取列表
    check:
      - 列表区域显示「还没有任务。」，没有任何任务条目
      - header 里的计数器显示「未完成 0」

  - go: 打开统计视图 http://localhost:4173/?view=stats
    check:
      - 「总任务数」等于 0
      - 「未完成」等于 0
      - 「已完成」等于 0
