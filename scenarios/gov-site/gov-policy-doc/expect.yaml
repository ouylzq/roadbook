# 中国政府网政策文件的验收路线。格式说明见 todo-persistence/expect.yaml 头注。
#
# 公网只读场景：每一屏都是线上真页面。唯一"跑的时候才知道"的事实是 runner 挑中了哪条文件，
# 它连同四个照抄的字段值一起写在 context 里；裁判拿同一个详情页地址去核对这几个值。

goal: 最新那条国务院文件的详情页，标题、发文机关、发文字号、成文日期都读得到且自洽，并归档在「国务院文件」下

steps:
  - go: 打开政策列表 https://www.gov.cn/zhengce/，读「最新政策」区块
    check:
      - 页面上有「最新政策」这个区块标题
      - 「最新政策」区块里至少有三条政策条目，每条都带形如 2026-09-29 的日期
      - 至少有一条条目的标题以「国务院」或「中共中央办公厅」开头（是国家级文件，不是地方或部门文件）

  - go: 打开 context.policy_url 这份文件的详情页，读标题和发文信息
    check:
      - 页面顶部的大标题就是 context.policy_title
      - 页面上标注的发文机关是 context.issuing_body
      - 页面上标注的发文字号是 context.doc_number
      - 页面上标注的成文日期是 context.doc_date

  - go: 留在 context.policy_url 这一屏，读它的归档面包屑和索引信息
    check:
      - 面包屑里同时出现「信息公开」和「国务院文件」，说明它按国务院文件归档
      - 页面上有一行索引号，形如 000014349/2026-00073
      - 成文日期不晚于发布日期（先成文、后发布，两者的先后不能反）
